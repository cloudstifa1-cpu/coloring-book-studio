<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0b12">
<title>Coloring Book Studio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>Coloring Book Studio</h1>
  <p id="usage" class="usage">Pages made today: …</p>
</header>

<nav>
  <button class="tab active" data-tab="make">Make a Page</button>
  <button class="tab" data-tab="library">My Pages</button>
  <button class="tab" data-tab="book">Book</button>
</nav>

<main>
  <section id="make" class="panel">
    <label for="subject">Describe your scene</label>
    <textarea id="subject" rows="3" maxlength="500" placeholder="Example: an owl in a gothic cathedral window"></textarea>

    <label>Or pick a theme</label>
    <div id="themes" class="themes"></div>

    <label for="difficulty">Difficulty: <span id="diffLabel">3</span></label>
    <input id="difficulty" type="range" min="1" max="5" step="1" value="3">
    <div class="range-ends"><span>Simple</span><span>Very detailed</span></div>

    <div class="row">
      <button id="generate" class="big primary">Make Page</button>
      <button id="random" class="big">Random</button>
    </div>

    <div class="row">
      <select id="batchCount" aria-label="How many pages">
        <option value="5">5 pages</option>
        <option value="10">10 pages</option>
      </select>
      <button id="batch" class="big">Make Batch</button>
      <button id="stopBatch" class="big danger" hidden>Stop</button>
    </div>

    <p id="status" class="status" role="status"></p>

    <div id="result" class="result" hidden>
      <img id="resultImg" alt="Your coloring page">
      <p id="resultInfo" class="info"></p>
      <label id="weightLabel" for="weight">Line weight: 4 (Normal)</label>
      <input id="weight" type="range" min="1" max="9" step="1" value="4">
      <div class="range-ends"><span>Thinnest</span><span>Thickest</span></div>
      <div class="row">
        <button id="thinner" class="big">Thinner lines</button>
        <button id="thicker" class="big">Thicker lines</button>
      </div>
      <label for="pdfSize">PDF page size</label>
      <select id="pdfSize">
        <option value="letter">8.5 × 11 in</option>
        <option value="8x10">8 × 10 in</option>
        <option value="6x9">6 × 9 in</option>
      </select>
      <div class="row wrap">
        <button id="downloadPng" class="big">Download PNG</button>
        <button id="downloadPrint" class="big">Print-Sharp PNG</button>
        <button id="downloadPdf" class="big">Download PDF</button>
        <button id="again" class="big">Make Another</button>
        <button id="colorThis" class="big primary">Color This Page</button>
        <button id="addBook" class="big">Add to Book</button>
      </div>
    </div>
  </section>

  <section id="library" class="panel" hidden>
    <div class="row">
      <select id="filterTheme" aria-label="Filter by theme"><option value="">All themes</option></select>
      <label class="check"><input id="favOnly" type="checkbox"> Favorites</label>
    </div>
    <input id="search" type="search" placeholder="Search pages">
    <p id="libCount" class="info"></p>
    <div id="grid" class="grid"></div>

    <div id="viewer" class="viewer" hidden>
      <img id="viewerImg" alt="Saved coloring page">
      <p id="viewerInfo" class="info"></p>
      <label id="vWeightLabel" for="vWeight">Line weight: 4 (Normal)</label>
      <input id="vWeight" type="range" min="1" max="9" step="1" value="4">
      <div class="range-ends"><span>Thinnest</span><span>Thickest</span></div>
      <div class="row wrap">
        <button id="vColor" class="big primary">Color</button>
        <button id="vAddBook" class="big">Add to Book</button>
        <button id="vFav" class="big">☆ Favorite</button>
        <button id="vThinner" class="big">Thinner lines</button>
        <button id="vThicker" class="big">Thicker lines</button>
        <button id="vDownload" class="big">Download PNG</button>
        <button id="vPrint" class="big">Print-Sharp PNG</button>
        <button id="vPdf" class="big">Download PDF</button>
        <button id="vRemake" class="big">Remake / Vary</button>
        <button id="vColoredDl" class="big" hidden>Download Colored PNG</button>
        <button id="vDelete" class="big danger">Delete</button>
        <button id="vClose" class="big">Close</button>
      </div>
    </div>
  </section>
  <section id="book" class="panel" hidden>
    <label for="bTitle">Book title</label>
    <input id="bTitle" type="text" maxlength="80">
    <label for="bSubtitle">Subtitle (optional)</label>
    <input id="bSubtitle" type="text" maxlength="120">
    <label for="bAuthor">Your name (optional)</label>
    <input id="bAuthor" type="text" maxlength="80">
    <label for="bSize">Page size</label>
    <select id="bSize">
      <option value="letter">8.5 × 11 in</option>
      <option value="8x10">8 × 10 in</option>
      <option value="6x9">6 × 9 in</option>
    </select>
    <label class="check opt"><input id="bSingle" type="checkbox"> Single-sided (blank page behind each design so markers don't bleed)</label>
    <label class="check opt"><input id="bFrame" type="checkbox"> Border around each design</label>
    <label class="check opt"><input id="bColored" type="checkbox"> Use my colored versions (when a page has one)</label>
    <p id="bCount" class="info"></p>
    <p id="bEmpty" class="info">No pages yet. Open a page in My Pages and tap "Add to Book".</p>
    <div id="bList"></div>
    <button id="bExport" class="big primary full">Make Book PDF</button>
    <p id="bStatus" class="status" role="status"></p>
  </section>
</main>

<section id="colorer" class="colorer" hidden>
  <div class="row ctop">
    <button id="cDone" class="primary">Done</button>
    <button id="cUndo">Undo</button>
    <button id="cRedo">Redo</button>
    <button id="cZoomOut" aria-label="Zoom out">−</button>
    <span id="cZoomLabel" class="zl">1×</span>
    <button id="cZoomIn" aria-label="Zoom in">+</button>
  </div>
  <div id="cWrap" class="cwrap"><canvas id="cCanvas"></canvas></div>
  <p id="cMsg" class="status"></p>
  <div class="ctools">
    <div class="row">
      <span class="info">Color:</span><span id="cCurrent" class="current"></span>
      <label class="check">Pick any <input id="cCustom" type="color" value="#e53935"></label>
    </div>
    <p id="cRecentLabel" class="info" hidden>Recent:</p>
    <div id="cRecent" class="swatches"></div>
    <div id="cPalette" class="swatches"></div>
    <label for="cGap">Leak guard (stops color escaping through small gaps)</label>
    <select id="cGap">
      <option value="0">Off</option>
      <option value="1">Small gaps</option>
      <option value="2">Bigger gaps</option>
    </select>
    <div class="row wrap">
      <button id="cDownload" class="big">Download Colored PNG</button>
      <button id="cClear" class="big danger">Clear Colors</button>
    </div>
  </div>
</section>

<script type="module" src="app.js"></script>
</body>
</html>
